# Deploy poc/camera ke GitHub Pages setiap push ke main.
# Aktifkan dulu: Settings > Pages > Source: GitHub Actions.
# Lewati file ini bila memakai Cloudflare Pages / Netlify / Vercel.
name: Deploy PoC kamera

on:
  push:
    branches: [main]
    paths: ["poc/camera/**", ".github/workflows/poc-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cek sintaks JS dan JSON
        run: |
          node --check poc/camera/app.js
          node -e "JSON.parse(require('fs').readFileSync('poc/camera/slots.v2.json','utf8'))"
      - name: Cek slots.v2.json sama dengan hasil generator
        run: |
          python3 poc/camera/tools/gen_slots.py
          git diff --exit-code poc/camera/slots.v2.json

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: poc/camera
      - id: deployment
        uses: actions/deploy-pages@v4
